# Input
#INPUT                  = include src
FILE_PATTERNS          = *.cpp *.h *.hpp *.c
RECURSIVE              = YES
EXCLUDE                = bin extern libs build game/gamesys/GameTypeInfo.h game/gamesys/GameTypeInfo.cpp

# Output
OUTPUT_DIRECTORY       = docs/doxygen
GENERATE_XML           = YES
XML_OUTPUT             = xml
GENERATE_HTML          = NO
GENERATE_LATEX         = NO

# Extraction
EXTRACT_ALL            = YES
EXTRACT_PRIVATE        = NO
EXTRACT_STATIC         = YES
JAVADOC_AUTOBRIEF      = YES
WARN_IF_UNDOCUMENTED   = YES
WARN_LOGFILE           = docs/doxygen/doxygen_warnings.txt

# Groups/Pages
ENABLE_PREPROCESSING   = YES
MACRO_EXPANSION        = YES
PREDEFINED             = USE_INTRINSICS_SSE=1
